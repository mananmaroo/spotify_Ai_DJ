<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI DJ</title>

  <!-- Spotify Web Playback SDK -->
  <script src="https://sdk.scdn.co/spotify-player.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: white;
      text-align: center;
      margin: 0;
      padding: 40px;
    }

    input, button {
      padding: 10px;
      margin: 5px;
      border-radius: 5px;
      border: none;
    }

    button {
      background-color: #1DB954;
      color: white;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .card {
      background: #1e1e1e;
      padding: 20px;
      margin-top: 20px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <h1>🎵 AI DJ</h1>

  <div>
    <input id="trackName" placeholder="Track Name" />
    <input id="artistName" placeholder="Artist Name" />
    <button onclick="searchTrack()">Find Transition</button>
  </div>

  <div id="error" style="color:red;"></div>

  <div id="seedTrack" class="card" style="display:none;"></div>
  <div id="nextTrack" class="card" style="display:none;"></div>

  <script>
    let spotifyPlayer;
    let deviceId = null;
    let userAccessToken = null; // Must be OAuth token for playback

    // -------------------------------
    // SEARCH TRACK + GET NEXT TRACK
    // -------------------------------
    async function searchTrack() {
      const trackName = document.getElementById("trackName").value;
      const artistName = document.getElementById("artistName").value;

      document.getElementById("error").innerText = "";

      try {
        // SEARCH
        const searchRes = await fetch("/api/search", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            track_name: trackName,
            artist_name: artistName
          })
        });

        const track = await searchRes.json();
        if (track.error) throw new Error(track.error);

        const releaseYear = parseInt(track.album.release_date.slice(0,4));

        document.getElementById("seedTrack").style.display = "block";
        document.getElementById("seedTrack").innerHTML = `
          <h3>Seed Track</h3>
          <p>${track.name}</p>
          <p>Year: ${releaseYear}</p>
        `;

        // NEXT TRACK
        const nextRes = await fetch("/api/next-track", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            seed_track_id: track.id,
            year: releaseYear,
            window: 5
          })
        });

        const nextTrack = await nextRes.json();
        if (nextTrack.error) throw new Error(nextTrack.error);

        document.getElementById("nextTrack").style.display = "block";
        document.getElementById("nextTrack").innerHTML = `
          <h3>Next Track</h3>
          <p>${nextTrack.name}</p>
          <p>${nextTrack.artists.join(", ")}</p>
          <p>Year: ${nextTrack.year}</p>
          <p>Score: ${nextTrack.score}</p>
          <button onclick="playTrack('${nextTrack.next_track_id}')">
            ▶ Play Next Track
          </button>
        `;

      } catch (err) {
        console.error(err);
        document.getElementById("error").innerText = err.message;
      }
    }

    // -------------------------------
    // SPOTIFY PLAYBACK
    // -------------------------------

    window.onSpotifyWebPlaybackSDKReady = () => {
      spotifyPlayer = new Spotify.Player({
        name: "AI DJ Player",
        getOAuthToken: cb => { cb(userAccessToken); },
        volume: 0.5
      });

      spotifyPlayer.addListener('ready', ({ device_id }) => {
        deviceId = device_id;
        console.log('Device Ready:', device_id);
      });

      spotifyPlayer.connect();
    };

    async function playTrack(trackId) {
      if (!userAccessToken) {
        alert("You must implement Spotify OAuth to enable playback.");
        return;
      }

      await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
        method: "PUT",
        headers: {
          "Authorization": `Bearer ${userAccessToken}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          uris: [`spotify:track:${trackId}`]
        })
      });
    }
  </script>

</body>
</html>
