<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI DJ</title>

<script src="https://sdk.scdn.co/spotify-player.js"></script>

<style>
body { font-family: Arial; background:#121212; color:white; text-align:center; padding:40px;}
input, button {padding:10px; margin:5px; border-radius:5px; border:none;}
button {background:#1DB954; color:white; cursor:pointer;}
button:hover {opacity:0.9;}
.card {background:#1e1e1e; padding:20px; margin-top:20px; border-radius:10px;}
</style>
</head>
<body>

<h1>🎵 AI DJ</h1>

<div>
    <input id="trackName" placeholder="Track Name" />
    <input id="artistName" placeholder="Artist Name" />
    <button onclick="searchTrack()">Find Transition</button>
</div>

<div id="error" style="color:red;"></div>
<div id="seedTrack" class="card" style="display:none;"></div>
<div id="nextTrack" class="card" style="display:none;"></div>

<script>
let spotifyPlayer;
let deviceId = null;
let userAccessToken = null; // Set via Spotify OAuth

async function searchTrack() {
    const trackName = document.getElementById("trackName").value;
    const artistName = document.getElementById("artistName").value;
    document.getElementById("error").innerText = "";

    try {
        const searchRes = await fetch("/api/search", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({ track_name: trackName, artist_name: artistName })
        });
        const track = await searchRes.json();

        document.getElementById("seedTrack").style.display = "block";
        document.getElementById("seedTrack").innerHTML = `
            <h3>Seed Track</h3>
            <p>${track.name}</p>
            <p>Year: ${track.release_date ? track.release_date.slice(0,4) : "N/A"}</p>
            <p>${Array.isArray(track.artists) ? track.artists.join(", ") : track.artists || "Unknown"}</p>
        `;

        const nextRes = await fetch("/api/next-track", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({ track_name: trackName, artist_name: artistName })
        });
        const nextTrack = await nextRes.json();

        document.getElementById("nextTrack").style.display = "block";
        document.getElementById("nextTrack").innerHTML = `
            <h3>Next Track</h3>
            <p>${nextTrack.name}</p>
            <p>${Array.isArray(nextTrack.artists) ? nextTrack.artists.join(", ") : nextTrack.artists || "Unknown"}</p>
            <p>Year: ${nextTrack.release_date ? nextTrack.release_date.slice(0,4) : "N/A"}</p>
            <button onclick="playTrack('${nextTrack.id}')">▶ Play Next Track</button>
        `;
    } catch(err) {
        document.getElementById("error").innerText = err.message;
        console.error(err);
    }
}

// ---------------- SPOTIFY SDK ----------------
window.onSpotifyWebPlaybackSDKReady = () => {
    spotifyPlayer = new Spotify.Player({
        name: "AI DJ Player",
        getOAuthToken: cb => cb(userAccessToken),
        volume: 0.5
    });

    spotifyPlayer.addListener('ready', ({device_id}) => {
        deviceId = device_id;
        console.log('Device ready:', deviceId);
    });

    spotifyPlayer.connect();
};

async function playTrack(trackId) {
    if(!userAccessToken) return alert("Spotify OAuth required to play tracks");

    await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
        method:"PUT",
        headers:{
            "Authorization": `Bearer ${userAccessToken}`,
            "Content-Type": "application/json"
        },
        body: JSON.stringify({uris:[`spotify:track:${trackId}`]})
    });
}
</script>

</body>
</html>
