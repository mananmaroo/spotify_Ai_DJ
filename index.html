<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI DJ</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #fdf6e3;
      color: #333;
      text-align: center;
      padding: 40px;
    }

    input, button {
      padding: 12px 16px;
      margin: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background-color: #c19a6b;
      color: white;
      cursor: pointer;
      border: none;
    }

    button:hover {
      opacity: 0.9;
    }

    .card {
      background: #fff8f0;
      padding: 20px;
      margin-top: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: left;
    }

    h1 {
      color: #b5835a;
    }

    .section-title {
      color: #b5835a;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <h1>🎵 AI DJ</h1>

  <div>
    <input id="trackName" placeholder="Track Name" />
    <input id="artistName" placeholder="Artist Name" />
    <button onclick="searchTrack()">Find Next Track</button>
  </div>

  <div id="error" style="color:red; margin-top: 10px;"></div>

  <div id="seedTrack" class="card" style="display:none;"></div>
  <div id="nextTrack" class="card" style="display:none;"></div>

  <script>
    async function searchTrack() {
      const trackName = document.getElementById("trackName").value;
      const artistName = document.getElementById("artistName").value;
      document.getElementById("error").innerText = "";

      try {
        // Search seed track
        const searchRes = await fetch("/api/search", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({track_name: trackName, artist_name: artistName})
        });
        const seedTrack = await searchRes.json();

        document.getElementById("seedTrack").style.display = "block";
        document.getElementById("seedTrack").innerHTML = `
          <h3 class="section-title">Seed Track</h3>
          <p><strong>Name:</strong> ${seedTrack.name}</p>
          <p><strong>Artist:</strong> ${seedTrack.artists.join(", ")}</p>
          <p><strong>Year:</strong> ${seedTrack.release_date || "Unknown"}</p>
        `;

        // Get next track
        const nextRes = await fetch("/api/next-track", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({track_name: trackName, artist_name: artistName})
        });
        const nextTrack = await nextRes.json();

        document.getElementById("nextTrack").style.display = "block";
        document.getElementById("nextTrack").innerHTML = `
          <h3 class="section-title">Next Track</h3>
          <p><strong>Name:</strong> ${nextTrack.name}</p>
          <p><strong>Artist:</strong> ${nextTrack.artists.join(", ")}</p>
          <p><strong>Year:</strong> ${nextTrack.release_date || "Unknown"}</p>
          <p style="color:#999; font-size:14px;">*Spotify OAuth required to play tracks</p>
        `;

      } catch (err) {
        console.error(err);
        document.getElementById("error").innerText = err.message || "An error occurred";
      }
    }
  </script>
</body>
</html>
