<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI DJ</title>
  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: #f5f1ec;
      color: #333;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-size: 2.5rem;
      color: #cfa57f;
      margin-bottom: 30px;
    }
    .search-form {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    input {
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #cfa57f;
      min-width: 200px;
      font-size: 1rem;
    }
    button {
      padding: 12px 20px;
      border-radius: 6px;
      border: none;
      background-color: #cfa57f;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      opacity: 0.85;
    }
    #error {
      color: #e74c3c;
      font-weight: bold;
      margin-top: 10px;
    }
    .card {
      background: #fff7f0;
      color: #333;
      padding: 20px;
      margin-top: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      text-align: left;
    }
    .card h3 {
      margin-top: 0;
      color: #cfa57f;
    }
    .card p {
      margin: 5px 0;
    }
    .play-button {
      margin-top: 10px;
      background: #cfa57f;
      color: #fff;
      font-weight: bold;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      border-radius: 6px;
    }
    .play-button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <h1>🎵 AI DJ</h1>

  <div class="search-form">
    <input id="trackName" placeholder="Track Name" />
    <input id="artistName" placeholder="Artist Name" />
    <button onclick="searchTrack()">Find Transition</button>
  </div>

  <div id="error"></div>
  <div id="seedTrack" class="card" style="display:none;"></div>
  <div id="nextTrack" class="card" style="display:none;"></div>

  <script>
    let spotifyPlayer;
    let deviceId = null;
    let userAccessToken = null; // Implement Spotify OAuth for playback

    async function searchTrack() {
      const trackName = document.getElementById("trackName").value;
      const artistName = document.getElementById("artistName").value;
      document.getElementById("error").innerText = "";

      try {
        const searchRes = await fetch("/api/search", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ track_name: trackName, artist_name: artistName })
        });
        const track = await searchRes.json();

        document.getElementById("seedTrack").style.display = "block";
        document.getElementById("seedTrack").innerHTML = `
          <h3>Seed Track</h3>
          <p><strong>${track.name}</strong></p>
          <p>${track.artists ? track.artists.join(", ") : "Unknown Artist"}</p>
          <p>Year: ${track.release_date.slice(0,4)}</p>
        `;

        const nextRes = await fetch("/api/next-track", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ track_name: trackName, artist_name: artistName })
        });
        const nextTrack = await nextRes.json();

        document.getElementById("nextTrack").style.display = "block";
        document.getElementById("nextTrack").innerHTML = `
          <h3>Next Track</h3>
          <p><strong>${nextTrack.name}</strong></p>
          <p>${nextTrack.artists ? nextTrack.artists.join(", ") : "Unknown Artist"}</p>
          <p>Year: ${nextTrack.release_date.slice(0,4)}</p>
          <button class="play-button" onclick="playTrack('${nextTrack.id}')">▶ Play Next Track</button>
        `;
      } catch(err) {
        console.error(err);
        document.getElementById("error").innerText = err.message;
      }
    }

    window.onSpotifyWebPlaybackSDKReady = () => {
      spotifyPlayer = new Spotify.Player({
        name: "AI DJ Player",
        getOAuthToken: cb => { cb(userAccessToken); },
        volume: 0.5
      });
      spotifyPlayer.addListener('ready', ({ device_id }) => {
        deviceId = device_id;
        console.log('Spotify device ready:', device_id);
      });
      spotifyPlayer.connect();
    };

    async function playTrack(trackId) {
      if (!userAccessToken) {
        alert("Spotify OAuth required to play tracks!");
        return;
      }
      await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
        method: "PUT",
        headers: { "Authorization": `Bearer ${userAccessToken}`, "Content-Type": "application/json" },
        body: JSON.stringify({ uris: [`spotify:track:${trackId}`] })
      });
    }
  </script>

</body>
</html>
