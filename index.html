<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI DJ</title>
  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <style>
    body {
      font-family: "Arial", sans-serif;
      background-color: #f5f0e6;
      color: #3e3e3e;
      text-align: center;
      padding: 50px;
    }
    input, button {
      padding: 12px;
      margin: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #d4b996;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      border: none;
    }
    button:hover { opacity: 0.85; }
    .card {
      background: #fff3e6;
      padding: 20px;
      margin-top: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    h1 { color: #a37c5b; }
  </style>
</head>
<body>
  <h1>🎵 AI DJ</h1>

  <div>
    <input id="trackName" placeholder="Track Name" />
    <input id="artistName" placeholder="Artist Name" />
    <button onclick="searchTrack()">Find Transition</button>
  </div>

  <div id="error" style="color:red; margin-top:10px;"></div>

  <div id="seedTrack" class="card" style="display:none;"></div>
  <div id="nextTrack" class="card" style="display:none;"></div>

  <script>
    let spotifyPlayer;
    let deviceId = null;
    let userAccessToken = null; // OAuth required for playback

    async function searchTrack() {
      const trackName = document.getElementById("trackName").value;
      const artistName = document.getElementById("artistName").value;
      document.getElementById("error").innerText = "";

      try {
        // Seed track
        const res = await fetch("/api/search", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ track_name: trackName, artist_name: artistName })
        });
        const track = await res.json();
        const releaseYear = track.release_date ? track.release_date.slice(0,4) : "Unknown";
        document.getElementById("seedTrack").style.display = "block";
        document.getElementById("seedTrack").innerHTML = `
          <h3>Seed Track</h3>
          <p>${track.name}</p>
          <p>Artist: ${track.artists.join(", ")}</p>
          <p>Year: ${releaseYear}</p>
        `;

        // Next track
        const nextRes = await fetch("/api/next-track", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ track_name: trackName, artist_name: artistName })
        });
        const nextTrack = await nextRes.json();
        const nextYear = nextTrack.release_date ? nextTrack.release_date.slice(0,4) : "Unknown";
        document.getElementById("nextTrack").style.display = "block";
        document.getElementById("nextTrack").innerHTML = `
          <h3>Next Track</h3>
          <p>${nextTrack.name}</p>
          <p>Artist: ${nextTrack.artists.join(", ")}</p>
          <p>Year: ${nextYear}</p>
          <button onclick="playTrack('${nextTrack.id}')">▶ Play Next Track</button>
        `;

      } catch(err) {
        console.error(err);
        document.getElementById("error").innerText = err.message;
      }
    }

    window.onSpotifyWebPlaybackSDKReady = () => {
      spotifyPlayer = new Spotify.Player({
        name: "AI DJ Player",
        getOAuthToken: cb => { cb(userAccessToken); },
        volume: 0.5
      });
      spotifyPlayer.addListener('ready', ({ device_id }) => { deviceId = device_id; console.log('Device Ready:', device_id); });
      spotifyPlayer.connect();
    };

    async function playTrack(trackId){
      if(!userAccessToken){
        alert("Spotify OAuth required to play tracks.");
        return;
      }
      await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
        method:"PUT",
        headers:{
          "Authorization":`Bearer ${userAccessToken}`,
          "Content-Type":"application/json"
        },
        body: JSON.stringify({ uris:[`spotify:track:${trackId}`] })
      });
    }
  </script>
</body>
</html>
