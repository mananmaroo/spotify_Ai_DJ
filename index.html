<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI DJ</title>
<script src="https://sdk.scdn.co/spotify-player.js"></script>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f0e6;
    color: #333;
    text-align: center;
    margin: 0;
    padding: 40px;
}
input, button {
    padding: 10px;
    margin: 5px;
    border-radius: 5px;
    border: 1px solid #ccc;
}
button {
    background-color: #d4a373;
    color: white;
    cursor: pointer;
}
button:hover { opacity: 0.9; }
.card {
    background: #fff0e6;
    padding: 20px;
    margin-top: 20px;
    border-radius: 10px;
    border: 1px solid #e0c5a0;
}
</style>
</head>
<body>

<h1>🎵 AI DJ</h1>

<div>
<input id="trackName" placeholder="Track Name"/>
<input id="artistName" placeholder="Artist Name"/>
<button onclick="searchTrack()">Find Transition</button>
</div>

<div id="error" style="color:red"></div>
<div id="seedTrack" class="card" style="display:none"></div>
<div id="nextTrack" class="card" style="display:none"></div>

<script>
async function searchTrack() {
    const name = document.getElementById("trackName").value;
    const artist = document.getElementById("artistName").value;
    document.getElementById("error").innerText = "";
    try {
        const res1 = await fetch("/api/search", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({track_name:name, artist_name:artist})
        });
        const seed = await res1.json();
        document.getElementById("seedTrack").style.display="block";
        document.getElementById("seedTrack").innerHTML = `
            <h3>Seed Track</h3>
            <p>Name: ${seed.name || "Unknown"}</p>
            <p>Artist: ${(seed.artists || ["Unknown"]).join(", ")}</p>
            <p>Year: ${seed.release_date || "Unknown"}</p>
        `;
        const res2 = await fetch("/api/next-track", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({track_name:name, artist_name:artist})
        });
        const next = await res2.json();
        document.getElementById("nextTrack").style.display="block";
        document.getElementById("nextTrack").innerHTML = `
            <h3>Next Track</h3>
            <p>Name: ${next.name || "Unknown"}</p>
            <p>Artist: ${(next.artists || ["Unknown"]).join(", ")}</p>
            <p>Year: ${next.release_date || "Unknown"}</p>
            <p><i>Spotify OAuth required to play tracks</i></p>
        `;
    } catch(err) {
        console.error(err);
        document.getElementById("error").innerText = "Error fetching tracks.";
    }
}
</script>

</body>
</html>
