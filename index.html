<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI DJ</title>

<!-- Spotify Web Playback SDK -->
<script src="https://sdk.scdn.co/spotify-player.js"></script>

<style>
  body {
    font-family: 'Arial', sans-serif;
    background: #f5f0e6; /* calm beige */
    color: #333;
    text-align: center;
    margin: 0;
    padding: 40px;
  }

  input, button {
    padding: 10px 15px;
    margin: 5px;
    border-radius: 5px;
    border: none;
    font-size: 16px;
  }

  button {
    background-color: #d4a373;
    color: white;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    background-color: #b87d4b;
  }

  .card {
    background: #fff3e0;
    padding: 20px;
    margin-top: 20px;
    border-radius: 10px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
  }

  .section-title {
    color: #a0522d;
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<h1>🎵 AI DJ</h1>

<div>
  <input id="trackName" placeholder="Track Name" />
  <input id="artistName" placeholder="Artist Name" />
  <button onclick="searchTrack()">Find Transition</button>
</div>

<div id="error" style="color:red; margin-top:10px;"></div>

<div id="seedTrack" class="card" style="display:none;"></div>
<div id="nextTrack" class="card" style="display:none;"></div>

<script>
let spotifyPlayer;
let deviceId = null;
let userAccessToken = null; // OAuth needed for playback

function safeJoin(arr){
  return Array.isArray(arr) ? arr.join(", ") : "Unknown";
}

async function searchTrack() {
  const trackName = document.getElementById("trackName").value;
  const artistName = document.getElementById("artistName").value;
  document.getElementById("error").innerText = "";

  try {
    const res = await fetch("/api/search", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({track_name: trackName, artist_name: artistName})
    });
    const seedTrack = await res.json();

    document.getElementById("seedTrack").style.display = "block";
    document.getElementById("seedTrack").innerHTML = `
      <h3 class="section-title">Seed Track</h3>
      <p><strong>Name:</strong> ${seedTrack.name}</p>
      <p><strong>Artist:</strong> ${safeJoin(seedTrack.artists)}</p>
      <p><strong>Year:</strong> ${seedTrack.release_date}</p>
    `;

    const nextRes = await fetch("/api/next-track", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({track_name: trackName, artist_name: artistName})
    });
    const nextTrack = await nextRes.json();

    document.getElementById("nextTrack").style.display = "block";
    document.getElementById("nextTrack").innerHTML = `
      <h3 class="section-title">Next Track</h3>
      <p><strong>Name:</strong> ${nextTrack.name}</p>
      <p><strong>Artist:</strong> ${safeJoin(nextTrack.artists)}</p>
      <p><strong>Year:</strong> ${nextTrack.release_date}</p>
      <p style="color:#999; font-size:14px;">*Spotify OAuth required to play tracks</p>
      <button onclick="playTrack('${nextTrack.id}')">▶ Play Next Track</button>
    `;

  } catch (err) {
    console.error(err);
    document.getElementById("error").innerText = "Error: " + err.message;
  }
}

// Spotify playback
window.onSpotifyWebPlaybackSDKReady = () => {
  spotifyPlayer = new Spotify.Player({
    name: "AI DJ Player",
    getOAuthToken: cb => cb(userAccessToken),
    volume: 0.5
  });

  spotifyPlayer.addListener('ready', ({ device_id }) => {
    deviceId = device_id;
    console.log('Device Ready:', device_id);
  });

  spotifyPlayer.connect();
};

async function playTrack(trackId){
  if(!userAccessToken){
    alert("Spotify OAuth required to play tracks.");
    return;
  }
  await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
    method: "PUT",
    headers: {
      "Authorization": `Bearer ${userAccessToken}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({uris: [`spotify:track:${trackId}`]})
  });
}
</script>

</body>
</html>
